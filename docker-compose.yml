services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankguard}
      POSTGRES_USER: ${POSTGRES_USER:-bankguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-bankguard-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankguard} -d ${POSTGRES_DB:-bankguard}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-bankguard}:${POSTGRES_PASSWORD:-local-bankguard-password}@db:5432/${POSTGRES_DB:-bankguard}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HMAC_SECRET: ${HMAC_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
